server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 fetch 走同源相对 /api（见 frontend/src/services/），生产由这里反代，
    # 与开发期 Vite proxy 行为一致 —— 因此后端不需要为生产放开 CORS。
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # nginx 自身探活，不打后端。
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 一次「生成变体」要等 Sonnet 出多个变体，实测可到分钟级；
        # nginx 默认 proxy_read_timeout 60s 会把请求切断，前端看到 504。
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # LLM 响应逐步产生，别在 nginx 侧攒完再吐。
        proxy_buffering off;
    }

    # /docs 与 /openapi.json 默认不对外暴露 —— 公网挂着一份完整 API schema
    # 没必要。内网试用需要时，取消下面注释重建镜像。
    # location ~ ^/(docs|redoc|openapi\.json)$ {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    # }

    # Vite 产物文件名带内容 hash，可长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html 绝不缓存：它引用的是带 hash 的 assets，缓存了就发不出新版本。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # BrowserRouter 深链（如直接访问 /dashboard）交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
