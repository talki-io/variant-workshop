name: CI

on:
  pull_request:
  push:
    branches: [master]

# 同一分支的旧任务在新提交推上来时取消，省 runner 时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        # 必须是 pgvector 镜像：迁移 0001 会 CREATE EXTENSION vector。
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: imitator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d imitator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # playwright 的 pip 包不下载浏览器，测试也不 launch 浏览器，所以不跑 `playwright install`。
      - run: pip install -r requirements.txt

      # DATABASE_URL 必须指向 imitator_test：tests/conftest.py 看到这个库名才会
      # 自动建库 + 迁移 + seed。不带它会回退到 live 库并污染真实数据。
      - name: pytest
        run: python -m pytest tests -q
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/imitator_test
          USE_REAL_LLM: 'false'

  frontend:
    name: 前端 · 构建 + 产物门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 含 tsc --noEmit。类型错在这里断掉。
      - run: npm run build

      # 静态：chunk 之间不能有循环引用。
      # manualChunks 分错会让 antd 在 React 初始化前读 React.version → 整页白屏，
      # 而 tsc 和 vite build 都不会报错（开发模式不走分包）。
      - run: npm run check:bundle

      # 动态：用 headless Chrome 真的打开生产构建，断言零 Uncaught 且 React 挂载了。
      # `npm run build` 通过 ≠ 页面跑得起来。ubuntu runner 预装 google-chrome。
      - name: smoke（headless 打开生产构建）
        run: npm run smoke
